<!doctype html>
<html lang="fr" data-theme="jour">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- 'unsafe-inline' pour les styles : positions du chemin et progression posées en attribut style. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; media-src 'self'; connect-src 'self'; font-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Mes livres audio</title>
  <meta name="theme-color" content="#BFE6F2">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mes livres">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main id="app">
    <!-- Écran de chargement : remplacé par le premier écran dès que le catalogue est là. -->
    <div class="loading" role="status" aria-label="Chargement des histoires">
      <svg class="loading-scene" viewBox="0 0 200 200" aria-hidden="true">
        <circle class="loading-disc" cx="100" cy="100" r="80"/>
        <g transform="translate(30 86)"><g class="loading-note">
          <ellipse rx="7" ry="5.4" transform="rotate(-22)"/><rect x="4.6" y="-30" width="3" height="30" rx="1.5"/><path d="M7.6-30q9 3 9 13q-3-6-9-7z"/>
        </g></g>
        <g transform="translate(160 82)"><g class="loading-note">
          <ellipse rx="7" ry="5.4" transform="rotate(-22)"/><rect x="4.6" y="-30" width="3" height="30" rx="1.5"/><path d="M7.6-30q9 3 9 13q-3-6-9-7z"/>
        </g></g>
        <g transform="translate(140 44)"><g class="loading-note">
          <ellipse rx="6" ry="4.6" transform="rotate(-22)"/><rect x="3.8" y="-25" width="2.6" height="25" rx="1.3"/><path d="M6.4-25q8 3 8 11q-3-5-8-6z"/>
        </g></g>
        <ellipse class="loading-shadow" cx="100" cy="176" rx="38" ry="7"/>
        <g class="loading-bear"><g transform="translate(100 112) scale(2.6)">
          <circle cx="-13" cy="-14" r="8" fill="#8A5630"/><circle cx="13" cy="-14" r="8" fill="#8A5630"/>
          <circle cx="-13" cy="-14" r="4" fill="#E9C9A0"/><circle cx="13" cy="-14" r="4" fill="#E9C9A0"/>
          <circle r="20" fill="#9C6137"/><ellipse cy="6" rx="10" ry="8" fill="#E9C9A0"/>
          <circle cx="-7" cy="-4" r="2.4" fill="#2A1A10"/><circle cx="7" cy="-4" r="2.4" fill="#2A1A10"/>
          <ellipse cy="2.5" rx="3.4" ry="2.4" fill="#2A1A10"/>
          <path d="M-4 9q4 3 8 0" stroke="#2A1A10" stroke-width="1.4" fill="none" stroke-linecap="round"/>
        </g></g>
      </svg>
      <div class="loading-dots" aria-hidden="true"><span></span><span></span><span></span></div>
    </div>
  </main>
  <div id="now-playing"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
